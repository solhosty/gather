services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roundup_dev
      POSTGRES_USER: roundup
      POSTGRES_PASSWORD: roundup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundup -d roundup_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
